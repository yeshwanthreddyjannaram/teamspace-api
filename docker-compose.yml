
services:
  db:
    image: postgres:16
    container_name: teamspace-db
    environment:
      POSTGRES_USER: teamspace_user
      POSTGRES_PASSWORD: teamspace_password
      POSTGRES_DB: teamspace_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamspace_user -d teamspace_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: teamspace-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://teamspace_user:teamspace_password@db:5432/teamspace_db
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
